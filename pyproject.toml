[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-bible-audit-cli"
version = "0.1.0"
description = "Audit a manuscript against a series bible: characters, places, contradictions, dead names, repeats, and continuity notes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["writing", "book", "continuity", "audit", "llm", "ollama", "authors", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
]
dependencies = []

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
bookbible = "bookbible.cli:main"

[tool.setuptools]
packages = ["bookbible"]
